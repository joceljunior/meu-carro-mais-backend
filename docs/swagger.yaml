      id:
        type: integer
      id_loja:
        type: integer
      id_produto:
        type: integer
      id_servico:
        type: integer
      id_usuario:
        type: integer
      id_veiculo:
        type: integer
      loja:
        $ref: '#/definitions/json.LojaResponse'
      produto:
        $ref: '#/definitions/json.ProdutoResponse'
      servico:
        $ref: '#/definitions/json.ServicoResponse'
      status:
        type: string
      tipo_resgate:
        type: string
      usuario:
        allOf:
        - $ref: '#/definitions/json.UserResponse'
        description: Dados relacionados
      valor:
        type: number
      veiculo:
        $ref: '#/definitions/json.VeiculoResponse'
    type: object
  json.HistoricoVeiculoResponse:
    properties:
