definitions:
  json.AnuncioDestaqueResponse:
    properties:
      descricao:
        type: string
      id:
        type: integer
      imagem:
        type: string
      preco:
        type: number
      titulo:
        type: string
    type: object
  json.AnuncioResponse:
    properties:
      categoria:
        type: string
      descricao:
        type: string
      destaque:
        type: boolean
      id:
        type: integer
      id_categoria:
        type: integer
      id_loja:
        type: integer
      imagem:
        type: string
      loja:
        $ref: '#/definitions/json.LojaResponse'
      preco:
        type: number
      titulo:
        type: string
    type: object
  json.AnunciosResponse:
    properties:
      anuncios:
        items:
          $ref: '#/definitions/json.AnuncioResponse'
        type: array
      total:
        type: integer
    type: object
  json.CategoriaAnuncioResponse:
    properties:
      id:
        type: integer
      nome:
        type: string
    type: object
  json.CategoriaLojistaResponse:
    properties:
      id:
        type: integer
      nome:
        type: string
    type: object
  json.CategoriaServicoResponse:
    properties:
      id:
        type: integer
      nome:
        type: string
    type: object
  json.CategoriasAnuncioResponse:
    properties:
      categorias:
        items:
          $ref: '#/definitions/json.CategoriaAnuncioResponse'
        type: array
      total:
        type: integer
    type: object
  json.CategoriasLojistaResponse:
    properties:
      categorias:
        items:
          $ref: '#/definitions/json.CategoriaLojistaResponse'
        type: array
      total:
        type: integer
    type: object
  json.CategoriasServicoResponse:
    properties:
      categorias:
        items:
          $ref: '#/definitions/json.CategoriaServicoResponse'
        type: array
      total:
        type: integer
    type: object
  json.HistoricoVeiculoResponse:
    properties:
      data:
        type: string
      data_cadastro:
        type: string
      descricao:
        type: string
      id:
        type: integer
      id_anuncio:
        type: integer
      id_veiculo:
        type: integer
    type: object
  json.HistoricosVeiculoResponse:
    properties:
      historicos:
        items:
          $ref: '#/definitions/json.HistoricoVeiculoResponse'
        type: array
      total:
        type: integer
    type: object
  json.LoginRequest:
    properties:
      email:
        type: string
      senha:
        type: string
    type: object
  json.LoginResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      loja:
        $ref: '#/definitions/json.LojaUsuarioResponse'
      nome:
        type: string
      nome_plano:
        type: string
    type: object
  json.LojaResponse:
    properties:
      categoria:
        type: string
      cnpj:
        type: string
      distancia:
        description: Distância em km
        type: number
      id:
        type: integer
      id_categoria:
        type: integer
      imagem:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      nome:
        type: string
    type: object
  json.LojaUsuarioResponse:
    properties:
      anuncio_destaque:
        $ref: '#/definitions/json.AnuncioDestaqueResponse'
      id:
        type: integer
      nome:
        type: string
    type: object
  json.LojasResponse:
    properties:
      lojas:
        items:
          $ref: '#/definitions/json.LojaResponse'
        type: array
      total:
        type: integer
    type: object
  json.ServicoResponse:
    properties:
      categoria:
        type: string
      descricao:
        type: string
      destaque:
        type: boolean
      distancia:
        type: number
      id:
        type: integer
      id_categoria:
        type: integer
      imagem:
        type: string
      loja:
        $ref: '#/definitions/json.LojaResponse'
      preco:
        type: number
      titulo:
        type: string
    type: object
  json.ServicosResponse:
    properties:
      servicos:
        items:
          $ref: '#/definitions/json.ServicoResponse'
        type: array
      total:
        type: integer
    type: object
  json.UserRequest:
    properties:
      cpf:
        type: string
      data_nascimento:
        type: string
      email:
        type: string
      endereco:
        type: string
      imagem:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      nome:
        type: string
      senha:
        minLength: 6
        type: string
      telefone:
        type: string
    required:
    - cpf
    - email
    - nome
    - senha
    type: object
  json.UserResponse:
    properties:
      ativo:
        type: boolean
      cpf:
        type: string
      data_cadastro:
        type: string
      data_nascimento:
        type: string
      email:
        type: string
      endereco:
        type: string
      id:
        type: integer
      id_loja:
        type: integer
      id_plano:
        type: integer
      imagem:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      mensagem:
        type: string
      nome:
        type: string
      telefone:
        type: string
    type: object
  json.VeiculoResponse:
    properties:
      ano:
        type: integer
      ativo:
        type: boolean
      cor:
        type: string
      data_cadastro:
        type: string
      id:
        type: integer
      id_usuario:
        type: integer
      modelo:
        type: string
      placa:
        type: string
    type: object
  json.VeiculosResponse:
    properties:
      total:
        type: integer
      veiculos:
        items:
          $ref: '#/definitions/json.VeiculoResponse'
        type: array
    type: object
info:
  contact: {}
paths:
  /anuncios:
    get:
      consumes:
      - application/json
      description: Retorna todos os anúncios disponíveis com informações da loja e
        categoria
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.AnunciosResponse'
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Lista todos os anúncios
      tags:
      - Anúncios
  /anuncios/categorias:
    get:
      consumes:
      - application/json
      description: Retorna todas as categorias de anúncio disponíveis
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.CategoriasAnuncioResponse'
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Lista categorias de anúncio
      tags:
      - Anúncios
  /login:
    post:
      consumes:
      - application/json
      description: Valida se o email existe. Se existir, retorna os dados do usuário.
        Se não existir, cria um novo usuário e retorna os dados.
      parameters:
      - description: Dados de login (email e senha)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/json.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.LoginResponse'
        "400":
          description: Dados inválidos
          schema:
            type: string
        "500":
          description: Erro interno do servidor
          schema:
            type: string
      summary: Login/Criação do usuário
      tags:
      - Autenticação
  /lojas/categorias:
    get:
      consumes:
      - application/json
      description: Retorna todas as categorias de lojista disponíveis
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.CategoriasLojistaResponse'
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Lista categorias de lojista
      tags:
      - Lojas
  /lojas/proximidade:
    get:
      consumes:
      - application/json
      description: Retorna lista de lojas ordenadas por proximidade do usuário
      parameters:
      - description: Latitude do usuário
        in: query
        name: latitude
        required: true
        type: number
      - description: Longitude do usuário
        in: query
        name: longitude
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.LojasResponse'
        "400":
          description: Parâmetros inválidos
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Lista lojas por proximidade
      tags:
      - Lojas
  /servicos/categorias:
    get:
      consumes:
      - application/json
      description: Retorna todas as categorias de serviço disponíveis
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.CategoriasServicoResponse'
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Lista categorias de serviço
      tags:
      - Serviços
  /servicos/proximidade:
    get:
      consumes:
      - application/json
      description: Retorna lista de serviços ordenados por proximidade do usuário
      parameters:
      - description: Latitude do usuário
        in: query
        name: latitude
        required: true
        type: number
      - description: Longitude do usuário
        in: query
        name: longitude
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.ServicosResponse'
        "400":
          description: Parâmetros inválidos
          schema:
            type: string
        "500":
          description: Erro interno do servidor
          schema:
            type: string
      summary: Lista serviços por proximidade
      tags:
      - Serviços
  /users:
    get:
      consumes:
      - application/json
      description: Retorna uma lista com todos os usuários ativos
      produces:
      - application/json
      responses:
        "200":
          description: Lista de usuários
          schema:
            items:
              $ref: '#/definitions/json.UserResponse'
            type: array
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Lista todos os usuários
      tags:
      - Usuários
    post:
      consumes:
      - application/json
      description: Cria um novo usuário com todos os dados fornecidos
      parameters:
      - description: Dados completos do usuário
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/json.UserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Usuário criado com sucesso
          schema:
            $ref: '#/definitions/json.UserResponse'
        "400":
          description: Dados inválidos
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Criação do usuário completo
      tags:
      - Usuários
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: Realiza soft delete do usuário, marcando como excluído sem remover
        do banco
      parameters:
      - description: ID do usuário
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Usuário excluído com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Usuário não encontrado
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Exclui usuário (soft delete)
      tags:
      - Usuários
    get:
      consumes:
      - application/json
      description: Retorna os dados de um usuário específico pelo ID
      parameters:
      - description: ID do usuário
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Usuário encontrado
          schema:
            $ref: '#/definitions/json.UserResponse'
        "400":
          description: ID inválido
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Usuário não encontrado
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Busca usuário por ID
      tags:
      - Usuários
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um usuário existente
      parameters:
      - description: ID do usuário
        in: path
        name: id
        required: true
        type: integer
      - description: Dados atualizados do usuário
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/json.UserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Usuário atualizado com sucesso
          schema:
            $ref: '#/definitions/json.UserResponse'
        "400":
          description: Dados inválidos
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Usuário não encontrado
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Atualiza usuário
      tags:
      - Usuários
  /users/{id}/restore:
    post:
      consumes:
      - application/json
      description: Restaura um usuário que foi soft deleted
      parameters:
      - description: ID do usuário
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Usuário restaurado com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Usuário não encontrado
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Restaura usuário excluído
      tags:
      - Usuários
  /usuarios/{id_usuario}/historico:
    get:
      consumes:
      - application/json
      description: Retorna o histórico de todos os veículos de um usuário específico
      parameters:
      - description: ID do usuário
        in: path
        name: id_usuario
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.HistoricosVeiculoResponse'
        "400":
          description: ID de usuário inválido
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Lista histórico de todos os veículos de um usuário
      tags:
      - Veículos
  /usuarios/{id_usuario}/veiculos:
    get:
      consumes:
      - application/json
      description: Retorna todos os veículos ativos de um usuário específico
      parameters:
      - description: ID do usuário
        in: path
        name: id_usuario
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.VeiculosResponse'
        "400":
          description: ID de usuário inválido
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Lista veículos de um usuário
      tags:
      - Veículos
  /veiculos/{id_veiculo}/historico:
    get:
      consumes:
      - application/json
      description: Retorna o histórico completo de um veículo específico
      parameters:
      - description: ID do veículo
        in: path
        name: id_veiculo
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.HistoricosVeiculoResponse'
        "400":
          description: ID de veículo inválido
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Lista histórico de um veículo
      tags:
      - Veículos
swagger: "2.0"
