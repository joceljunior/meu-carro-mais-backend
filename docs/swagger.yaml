definitions:
  json.AnuncioDestaqueResponse:
    properties:
      descricao:
        type: string
      id:
        type: integer
      imagem:
        type: string
      preco:
        type: number
      titulo:
        type: string
    type: object
  json.AnuncioRequest:
    properties:
      descricao:
        type: string
      destaque:
        type: boolean
      id_categoria:
        type: integer
      id_loja:
        type: integer
      id_produto:
        type: integer
      id_servico:
        type: integer
      id_veiculo:
        type: integer
      imagem:
        type: string
      preco:
        minimum: 0
        type: number
      tipo_anuncio:
        enum:
        - produto
        - servico
        - veiculo
        type: string
      titulo:
        type: string
    required:
    - descricao
    - id_categoria
    - id_loja
    - preco
    - tipo_anuncio
    - titulo
    type: object
  json.AnuncioResponse:
    properties:
      categoria:
        type: string
      descricao:
        type: string
      destaque:
        type: boolean
      id:
        type: integer
      id_categoria:
        type: integer
      id_loja:
        type: integer
      id_produto:
        type: integer
      id_servico:
        type: integer
      id_veiculo:
        type: integer
      imagem:
        type: string
      loja:
        $ref: '#/definitions/json.LojaResponse'
      preco:
        type: number
      produto:
        $ref: '#/definitions/json.ProdutoResponse'
      servico:
        $ref: '#/definitions/json.ServicoResponse'
      tipo_anuncio:
        type: string
      titulo:
        type: string
      veiculo:
        $ref: '#/definitions/json.VeiculoResponse'
    type: object
  json.AnunciosResponse:
    properties:
      anuncios:
        items:
          $ref: '#/definitions/json.AnuncioResponse'
        type: array
      total:
        type: integer
    type: object
  json.AvaliacaoEstatisticasResponse:
    properties:
      media_nota:
        type: number
      nota_1:
        type: integer
      nota_2:
        type: integer
      nota_3:
        type: integer
      nota_4:
        type: integer
      nota_5:
        type: integer
      total_avaliacoes:
        type: integer
    type: object
  json.AvaliacaoRequest:
    properties:
      comentario:
        maxLength: 500
        type: string
      id_loja:
        type: integer
      id_usuario:
        type: integer
      nota:
        maximum: 5
        minimum: 1
        type: integer
    required:
    - id_loja
    - id_usuario
    - nota
    type: object
  json.AvaliacaoResponse:
    properties:
      comentario:
        type: string
      data_atualizacao:
        type: string
      data_avaliacao:
        type: string
      id:
        type: integer
      id_loja:
        type: integer
      id_usuario:
        type: integer
      loja:
        $ref: '#/definitions/json.LojaResponse'
      nota:
        type: integer
      usuario:
        allOf:
        - $ref: '#/definitions/json.UserResponse'
        description: Dados relacionados
    type: object
  json.AvaliacoesResponse:
    properties:
      avaliacoes:
        items:
          $ref: '#/definitions/json.AvaliacaoResponse'
        type: array
      media_nota:
        type: number
      total:
        type: integer
    type: object
  json.CategoriaAnuncioResponse:
    properties:
      id:
        type: integer
      nome:
        type: string
    type: object
  json.CategoriaLojistaResponse:
    properties:
      id:
        type: integer
      nome:
        type: string
    type: object
  json.CategoriaServicoResponse:
    properties:
      id:
        type: integer
      nome:
        type: string
    type: object
  json.CategoriasAnuncioResponse:
