  json.ProdutoResponse:
    properties:
      ativo:
        type: boolean
      data_cadastro:
        type: string
      descricao:
        type: string
      estoque:
        type: integer
      id:
        type: integer
      id_loja:
        type: integer
      imagem:
        type: string
      loja:
        $ref: '#/definitions/json.LojaResponse'
      nome:
        type: string
      preco:
        type: number
    type: object
  json.ProdutosResponse:
    properties:
      produtos:
        items:
          $ref: '#/definitions/json.ProdutoResponse'
        type: array
      total:
        type: integer
    type: object
  json.ServicoRequest:
    properties:
