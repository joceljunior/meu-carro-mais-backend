definitions:
  json.AnuncioDestaqueResponse:
    properties:
      descricao:
        type: string
      id:
        type: integer
      imagem:
        type: string
      preco:
        type: number
      titulo:
        type: string
    type: object
  json.LoginRequest:
    properties:
      email:
        type: string
      senha:
        type: string
    type: object
  json.LoginResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      loja:
        $ref: '#/definitions/json.LojaUsuarioResponse'
      nome:
        type: string
      nome_plano:
        type: string
    type: object
  json.LojaResponse:
    properties:
      categoria:
        type: string
      cnpj:
        type: string
      distancia:
        description: Distância em km
        type: number
      id:
        type: integer
      id_categoria:
        type: integer
      imagem:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      nome:
        type: string
    type: object
  json.LojaUsuarioResponse:
    properties:
      anuncio_destaque:
        $ref: '#/definitions/json.AnuncioDestaqueResponse'
      id:
        type: integer
      nome:
        type: string
    type: object
  json.LojasResponse:
    properties:
      lojas:
        items:
          $ref: '#/definitions/json.LojaResponse'
        type: array
      total:
        type: integer
    type: object
  json.ServicoResponse:
    properties:
      categoria:
        type: string
      descricao:
        type: string
      destaque:
        type: boolean
      distancia:
        type: number
      id:
        type: integer
      id_categoria:
        type: integer
      imagem:
        type: string
      loja:
        $ref: '#/definitions/json.LojaResponse'
      preco:
        type: number
      titulo:
        type: string
    type: object
  json.ServicosResponse:
    properties:
      servicos:
        items:
          $ref: '#/definitions/json.ServicoResponse'
        type: array
      total:
        type: integer
    type: object
  json.UserRequest:
    properties:
      cpf:
        type: string
      email:
        type: string
      imagem:
        type: string
      nome:
        type: string
      password:
        type: string
      senha:
        type: string
    type: object
info:
  contact: {}
paths:
  /createuser:
    post:
      consumes:
      - application/json
      description: Cria um novo usuário
      parameters:
      - description: Dados do usuário
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/json.UserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Usuário criado com sucesso
          schema:
            type: string
        "400":
          description: Dados inválidos
          schema:
            type: string
      summary: Criação do usuário
      tags:
      - Criação de Usuário
  /login:
    post:
      consumes:
      - application/json
      description: Valida se o email existe. Se existir, retorna os dados do usuário.
        Se não existir, cria um novo usuário e retorna os dados.
      parameters:
      - description: Dados de login (email e senha)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/json.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.LoginResponse'
        "400":
          description: Dados inválidos
          schema:
            type: string
        "500":
          description: Erro interno do servidor
          schema:
            type: string
      summary: Login/Criação do usuário
      tags:
      - Autenticação
  /lojas/proximidade:
    get:
      consumes:
      - application/json
      description: Retorna lista de lojas ordenadas por proximidade do usuário
      parameters:
      - description: Latitude do usuário
        in: query
        name: latitude
        required: true
        type: number
      - description: Longitude do usuário
        in: query
        name: longitude
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.LojasResponse'
        "400":
          description: Parâmetros inválidos
          schema:
            type: string
        "500":
          description: Erro interno do servidor
          schema:
            type: string
      summary: Lista lojas por proximidade
      tags:
      - Lojas
  /servicos/proximidade:
    get:
      consumes:
      - application/json
      description: Retorna lista de serviços ordenados por proximidade do usuário
      parameters:
      - description: Latitude do usuário
        in: query
        name: latitude
        required: true
        type: number
      - description: Longitude do usuário
        in: query
        name: longitude
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.ServicosResponse'
        "400":
          description: Parâmetros inválidos
          schema:
            type: string
        "500":
          description: Erro interno do servidor
          schema:
            type: string
      summary: Lista serviços por proximidade
      tags:
      - Serviços
swagger: "2.0"
