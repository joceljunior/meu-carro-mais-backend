      id_produto:
        type: integer
      id_servico:
        type: integer
      id_usuario:
        type: integer
      id_veiculo:
        type: integer
      status:
        enum:
        - pendente
        - confirmado
        - cancelado
        type: string
      tipo_resgate:
        enum:
        - produto
        - servico
        - veiculo
        type: string
      valor:
        minimum: 0
        type: number
    required:
