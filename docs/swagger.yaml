info:
  contact: {}
paths:
  /users:
    post:
      consumes:
      - application/json
      description: Cria um novo usuário com todos os dados fornecidos
      parameters:
      - description: Dados completos do usuário
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/json.UserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Usuário criado com sucesso
          schema:
            $ref: '#/definitions/json.UserResponse'
        "400":
          description: Dados inválidos
          schema:
            type: object
            properties:
              error:
                type: string
              details:
                type: string
        "500":
          description: Erro interno do servidor
          schema:
            type: object
            properties:
              error:
                type: string
      summary: Criação do usuário completo
      tags:
      - Usuários
  /login:
    post:
      consumes:
      - application/json
      description: Valida se o email existe. Se existir, retorna os dados do usuário.
        Se não existir, cria um novo usuário e retorna os dados.
      parameters:
      - description: Dados de login (email e senha)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/json.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.LoginResponse'
        "400":
          description: Dados inválidos
          schema:
            type: string
        "500":
          description: Erro interno do servidor
          schema:
            type: string
      summary: Login/Criação do usuário
      tags:
      - Autenticação
  /lojas/proximidade:
    get:
      consumes:
      - application/json
      description: Retorna lista de lojas ordenadas por proximidade do usuário
      parameters:
      - description: Latitude do usuário
        in: query
        name: latitude
        required: true
        type: number
      - description: Longitude do usuário
        in: query
        name: longitude
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.LojasResponse'
        "400":
          description: Parâmetros inválidos
          schema:
            type: string
        "500":
          description: Erro interno do servidor
          schema:
            type: string
      summary: Lista lojas por proximidade
      tags:
      - Lojas
  /lojas/categorias:
    get:
      consumes:
      - application/json
      description: Retorna todas as categorias de lojista disponíveis
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.CategoriasLojistaResponse'
        "500":
          description: Erro interno do servidor
          schema:
            type: object
            properties:
              error:
                type: string
      summary: Lista categorias de lojista
      tags:
      - Lojas
  /servicos/proximidade:
    get:
      consumes:
      - application/json
      description: Retorna lista de serviços ordenados por proximidade do usuário
      parameters:
      - description: Latitude do usuário
        in: query
        name: latitude
        required: true
        type: number
      - description: Longitude do usuário
        in: query
        name: longitude
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.ServicosResponse'
        "400":
          description: Parâmetros inválidos
          schema:
            type: string
        "500":
          description: Erro interno do servidor
          schema:
            type: string
      summary: Lista serviços por proximidade
      tags:
      - Serviços
  /servicos/categorias:
    get:
      consumes:
      - application/json
      description: Retorna todas as categorias de serviço disponíveis
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.CategoriasServicoResponse'
        "500":
          description: Erro interno do servidor
          schema:
            type: object
            properties:
              error:
                type: string
      summary: Lista categorias de serviço
      tags:
      - Serviços
  /anuncios:
    get:
      consumes:
      - application/json
      description: Retorna todos os anúncios disponíveis com informações da loja e categoria
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.AnunciosResponse'
        "500":
          description: Erro interno do servidor
          schema:
            type: object
            properties:
              error:
                type: string
      summary: Lista todos os anúncios
      tags:
      - Anúncios
  /anuncios/categorias:
    get:
      consumes:
      - application/json
      description: Retorna todas as categorias de anúncio disponíveis
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.CategoriasAnuncioResponse'
        "500":
          description: Erro interno do servidor
          schema:
            type: object
            properties:
              error:
                type: string
      summary: Lista categorias de anúncio
      tags:
      - Anúncios
