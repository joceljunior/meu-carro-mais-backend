info:
  contact: {}
paths:
  /anuncios:
    get:
      consumes:
      - application/json
      description: Retorna uma lista com todos os anúncios ativos
      produces:
      - application/json
      responses:
        "200":
          description: Lista de anúncios
          schema:
            items:
              $ref: '#/definitions/json.AnuncioResponse'
            type: array
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Lista todos os anúncios
      tags:
      - Anúncios
    post:
      consumes:
      - application/json
      description: Cria um novo anúncio com todos os dados fornecidos
      parameters:
      - description: Dados completos do anúncio
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/json.AnuncioRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Anúncio criado com sucesso
          schema:
            $ref: '#/definitions/json.AnuncioResponse'
        "400":
          description: Dados inválidos
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Criação do anúncio completo
      tags:
      - Anúncios
  /anuncios/{id}:
    delete:
      consumes:
      - application/json
      description: Realiza soft delete do anúncio, marcando como excluído sem remover
        do banco
      parameters:
      - description: ID do anúncio
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Anúncio excluído com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Anúncio não encontrado
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Exclui anúncio (soft delete)
      tags:
      - Anúncios
    get:
      consumes:
      - application/json
      description: Retorna os dados de um anúncio específico pelo ID
      parameters:
      - description: ID do anúncio
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Anúncio encontrado
          schema:
            $ref: '#/definitions/json.AnuncioResponse'
        "400":
          description: ID inválido
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Anúncio não encontrado
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Busca anúncio por ID
      tags:
      - Anúncios
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um anúncio existente
      parameters:
      - description: ID do anúncio
        in: path
        name: id
        required: true
        type: integer
      - description: Dados atualizados do anúncio
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/json.AnuncioRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Anúncio atualizado com sucesso
          schema:
            $ref: '#/definitions/json.AnuncioResponse'
        "400":
          description: Dados inválidos
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Anúncio não encontrado
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Atualiza anúncio
      tags:
      - Anúncios
  /anuncios/{id}/restore:
    post:
      consumes:
      - application/json
      description: Restaura um anúncio que foi soft deleted
      parameters:
      - description: ID do anúncio
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Anúncio restaurado com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Anúncio não encontrado
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Restaura anúncio excluído
      tags:
      - Anúncios
  /anuncios/categorias:
    get:
      consumes:
      - application/json
      description: Retorna todas as categorias de anúncio disponíveis
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.CategoriasAnuncioResponse'
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Lista categorias de anúncio
      tags:
      - Anúncios
  /avaliacoes:
    get:
      consumes:
      - application/json
      description: Retorna todas as avaliações ativas do sistema
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.AvaliacoesResponse'
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Lista todas as avaliações
      tags:
      - Avaliações
    post:
      consumes:
      - application/json
      description: Cria uma nova avaliação de loja no sistema
      parameters:
      - description: Dados da avaliação
        in: body
        name: avaliacao
        required: true
        schema:
          $ref: '#/definitions/json.AvaliacaoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/json.AvaliacaoResponse'
        "400":
          description: Dados inválidos
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Cria uma nova avaliação
      tags:
      - Avaliações
  /avaliacoes/{id}:
    delete:
      consumes:
      - application/json
      description: Realiza soft delete de uma avaliação, marcando-a como excluída
      parameters:
      - description: ID da avaliação
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Avaliação removida com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Avaliação não encontrada
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Remove avaliação (soft delete)
      tags:
      - Avaliações
    get:
      consumes:
      - application/json
      description: Retorna uma avaliação específica pelo ID
      parameters:
      - description: ID da avaliação
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.AvaliacaoResponse'
        "400":
          description: ID inválido
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Avaliação não encontrada
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Busca avaliação por ID
      tags:
      - Avaliações
    put:
      consumes:
