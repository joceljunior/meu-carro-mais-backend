  json.ProdutoRequest:
    properties:
      descricao:
        type: string
      estoque:
        minimum: 0
        type: integer
      id_loja:
        type: integer
      imagem:
        type: string
      nome:
        type: string
      preco:
        minimum: 0
        type: number
    required:
