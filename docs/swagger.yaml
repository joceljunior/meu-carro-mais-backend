paths:
  /anuncios:
    get:
      consumes:
      - application/json
      description: Retorna uma lista com todos os anúncios ativos, incluindo preço
        original, preço com desconto, porcentagem de desconto e avaliação da loja
      produces:
      - application/json
      responses:
        "200":
          description: Lista de anúncios (cada anúncio inclui preco_original, preco_com_desconto,
            porcentagem_desconto e avaliacao)
          schema:
            items:
              $ref: '#/definitions/json.AnuncioResponse'
            type: array
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Lista todos os anúncios
      tags:
      - Anúncios
    post:
      consumes:
      - application/json
      description: Cria um novo anúncio com todos os dados fornecidos, incluindo porcentagem
        de desconto e preço com desconto
      parameters:
      - description: Dados completos do anúncio (inclui porcentagem_desconto e preco_com_desconto)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/json.AnuncioRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Anúncio criado com sucesso (inclui preco_original, preco_com_desconto,
            porcentagem_desconto e avaliacao)
          schema:
            $ref: '#/definitions/json.AnuncioResponse'
        "400":
          description: Dados inválidos
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Criação do anúncio completo
      tags:
      - Anúncios
  /anuncios/{id}:
    delete:
      consumes:
      - application/json
      description: Realiza soft delete do anúncio, marcando como excluído sem remover
        do banco
      parameters:
      - description: ID do anúncio
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Anúncio excluído com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Anúncio não encontrado
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Exclui anúncio (soft delete)
      tags:
      - Anúncios
    get:
      consumes:
      - application/json
      description: Retorna os dados de um anúncio específico pelo ID, incluindo preço
        original, preço com desconto, porcentagem de desconto e avaliação da loja
      parameters:
      - description: ID do anúncio
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Anúncio encontrado (inclui preco_original, preco_com_desconto,
            porcentagem_desconto e avaliacao)
          schema:
            $ref: '#/definitions/json.AnuncioResponse'
        "400":
          description: ID inválido
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Anúncio não encontrado
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Busca anúncio por ID
      tags:
      - Anúncios
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um anúncio existente, incluindo porcentagem
        de desconto e preço com desconto
      parameters:
      - description: ID do anúncio
        in: path
        name: id
        required: true
        type: integer
      - description: Dados atualizados do anúncio (inclui porcentagem_desconto e preco_com_desconto)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/json.AnuncioRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Anúncio atualizado com sucesso (inclui preco_original, preco_com_desconto,
            porcentagem_desconto e avaliacao)
          schema:
            $ref: '#/definitions/json.AnuncioResponse'
        "400":
          description: Dados inválidos
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Anúncio não encontrado
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Atualiza anúncio
      tags:
      - Anúncios
  /anuncios/{id}/resgatar:
    post:
      consumes:
      - application/json
      description: Cria um histórico de resgate com status pendente quando um usuário
