  json.HistoricosResgateResponse:
    properties:
      historicos:
        items:
          $ref: '#/definitions/json.HistoricoResgateResponse'
        type: array
      total:
        type: integer
    type: object
  json.HistoricosVeiculoResponse:
    properties:
      historicos:
        items:
          $ref: '#/definitions/json.HistoricoVeiculoResponse'
        type: array
      total:
        type: integer
    type: object
  json.LoginRequest:
    properties:
      email:
        type: string
      senha:
        type: string
    type: object
  json.LoginResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      loja:
        $ref: '#/definitions/json.LojaUsuarioResponse'
      nome:
        type: string
      nome_plano:
        type: string
