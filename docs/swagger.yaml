        type: array
      total:
        type: integer
    type: object
  json.CategoriasLojistaResponse:
    properties:
      categorias:
        items:
          $ref: '#/definitions/json.CategoriaLojistaResponse'
        type: array
      total:
        type: integer
    type: object
  json.CategoriasServicoResponse:
    properties:
      categorias:
        items:
          $ref: '#/definitions/json.CategoriaServicoResponse'
        type: array
      total:
        type: integer
    type: object
  json.FotoRequest:
    properties:
      id_loja:
        type: integer
      id_produto:
        type: integer
      id_servico:
        type: integer
      id_veiculo:
        type: integer
      id_veiculo_loja:
        type: integer
      nome_arquivo:
        type: string
      ordem:
        type: integer
      principal:
        type: boolean
      tamanho:
        minimum: 1
        type: integer
      tipo_entidade:
        enum:
        - veiculo
        - veiculo_loja
        - produto
        - servico
        - loja
        type: string
      tipo_mime:
        type: string
      url:
        type: string
    required:
    - nome_arquivo
    - tamanho
    - tipo_entidade
    - tipo_mime
    - url
    type: object
  json.FotoResponse:
    properties:
      data_atualizacao:
        type: string
      data_upload:
        type: string
      id:
        type: integer
      id_loja:
        type: integer
      id_produto:
        type: integer
      id_servico:
        type: integer
      id_veiculo:
        type: integer
      id_veiculo_loja:
        type: integer
      loja:
        $ref: '#/definitions/json.LojaResponse'
      nome_arquivo:
        type: string
      ordem:
        type: integer
      principal:
        type: boolean
      produto:
        $ref: '#/definitions/json.ProdutoResponse'
      servico:
        $ref: '#/definitions/json.ServicoResponse'
      tamanho:
        type: integer
      tipo_entidade:
        type: string
      tipo_mime:
        type: string
      url:
